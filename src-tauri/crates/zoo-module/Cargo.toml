[package]
name = "zoo-module"
version = "0.1.0"
edition = "2021"
description = "Site module host (`zoo-module serve`) and module developer CLI. The only crate that links V8."
publish = false

[dependencies]
zoo-module-client = { path = "../zoo-module-client" }
deno_core = "0.372"
deno_error = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "cookies", "gzip", "brotli", "deflate"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
