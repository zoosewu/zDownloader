[package]
name = "zoo-core"
version = "0.1.0"
edition = "2021"
description = "Download core for zoo-downloader. No Tauri or JS runtime dependencies."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
url = "2.5"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "test-util", "net", "io-util"] }
