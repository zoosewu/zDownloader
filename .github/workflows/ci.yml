# Every push to main and every pull request: type check and tests on the frontend; the Rust
# workspace is tested on Windows (where the app is tried for real) and must compile on macOS
# and Linux, which the Release workflow also builds; there only the browser bridge is tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Compile (macOS, Linux)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo check --workspace --all-targets
      # The local socket differs per OS (macOS cannot set a socket file's mode).
      - name: Test the browser extension bridge (macOS, Linux)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        shell: bash
        # Failures also become annotations, which can be read without signing in.
        run: |
          set -o pipefail
          { cargo test -p zoo-native-host && cargo test -p zoo-downloader browser_bridge; } 2>&1 | tee test.log || {
            grep -E -A6 "^error|panicked|FAILED|^---- " test.log | head -40 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g; s/^/::error title=bridge tests::/'
            echo
            exit 1
          }
