<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoo Downloader</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #333;
    }
    .status {
      padding: 8px 12px;
      background-color: #f0f0f0;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .status.connected {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background-color: #ffebee;
      color: #c62828;
    }
    .links-found {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background-color: #1565c0;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .footer {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>🦓 Zoo Downloader</h1>

  <div id="status" class="status disconnected">
    Status: Checking connection...
  </div>

  <div id="linksFound" class="links-found">
    Links found on this page: <span id="linkCount">0</span>
  </div>

  <button id="detectLinks">Detect Download Links</button>
  <button id="sendAllLinks" disabled>Send All Links to Downloader</button>

  <div class="footer">
    Zoo Downloader Extension v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
