# Every push to main and every pull request: type check and tests on the frontend; the Rust
# workspace is tested on Windows (where the app is tried for real) and must compile on macOS
# and Linux, which the Release workflow also builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Compile (macOS, Linux)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo check --workspace --all-targets
