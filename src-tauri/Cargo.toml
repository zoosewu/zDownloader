[package]
name = "zoo-downloader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zoo_downloader_lib"
# Note: Removed "cdylib" because deno_core's V8 uses thread-local storage
# which is incompatible with shared libraries (Feature 004)
crate-type = ["staticlib", "rlib"]

[workspace]
members = ["crates/zoo-core", "crates/zoo-module-client", "crates/zoo-module"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zoo-core = { path = "crates/zoo-core" }
ts-rs = "12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "2.0"
dirs = "5.0"
futures = "0.3"
regex = "1"
warp = "0.3"
log = "0.4"

# Module system dependencies (Feature 004)
deno_core = "0.372"  # Updated to latest available version
semver = "1.0"

[dev-dependencies]
tempfile = "3.8"

